<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitsubishi Evo IX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
            padding: 40px;
        }

        .profile {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .profile img {
            width: 100%;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .tagline {
            color: #666;
        }

        .specs {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .spec {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="evo9.jpg" alt="Mitsubishi Lancer Evolution IX">

        <h1>Mitsubishi Lancer Evolution IX</h1>

        <p class="tagline">
            A legendary JDM performance icon.
        </p>

        <p>
            The Evo IX is known for its rally-bred performance,
            aggressive design and legendary all-wheel-drive system.
        </p>

        <div class="specs">
            <div>
                <div class="spec">2.0L</div>
                Engine
            </div>

            <div>
                <div class="spec">Turbo</div>
                Power
            </div>

            <div>
                <div class="spec">AWD</div>
                Drivetrain
            </div>
        </div>

    </div>

</body>
</html>
